# =====================================================================
# docker/compose.yml
#
# Brings up Postgres + the ETL pipeline together, so you don't need a
# host-installed Postgres at all.
#
# Reuses values from your existing .env file automatically — Compose
# loads any file named ".env" next to this compose.yml and substitutes
# ${VARIABLE} references below with values from it. No values are
# duplicated by hand; PGHOST is the one exception (see comment below).
#
# NOTE ON PATHS: this file lives in docker/, but `build.context: ..`
# points the build at the project root (UBER/), which is where
# pyproject.toml, uv.lock, model/, scripts/, utils/, etc. actually live.
# The Dockerfile path is given relative to this context, so it's
# docker/Dockerfile, not just Dockerfile.
#
# Usage (run from inside docker/, or add -f docker/compose.yml from root):
#   docker compose up --build        # build the pipeline image, start both, run once
#   docker compose up --build db     # just start Postgres, e.g. to inspect data
#   docker compose run --rm pipeline # re-run the pipeline on demand
#   docker compose down              # stop everything (data persists in the volume)
#   docker compose down -v           # stop everything AND wipe the Postgres data
# =====================================================================

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      # NOTE: the official postgres image expects POSTGRES_USER / POSTGRES_DB,
      # not POSTGRES_USERNAME / POSTGRES_DATABASE — mapped here from your
      # existing .env names so you don't need a second, duplicate set of vars.
      POSTGRES_USER: ${POSTGRES_USERNAME}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DATABASE}
    ports:
      # host:container — lets you still connect with a local psql/DBeaver/etc.
      # at localhost:5432 if you want to poke around outside the pipeline.
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USERNAME} -d ${POSTGRES_DATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 10

  pipeline:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      # PGHOST is intentionally hardcoded to "db" (the service name above),
      # NOT ${POSTGRES_HOST} from .env — inside Compose's network, containers
      # reach each other by service name, and your .env's "localhost" would
      # point the pipeline container at itself instead of the db container.
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DATABASE}
      PGUSER: ${POSTGRES_USERNAME}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      # utils/db.py (used by incremental.py and data_quality_checks.py)
      # reads POSTGRES_* names via SQLAlchemy, not the PG* names above —
      # psql and psycopg2-via-SQLAlchemy don't share an env var convention,
      # so both sets need to be set to the same values. Same "db" reasoning
      # as PGHOST: service-name networking, not .env's "localhost".
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DATABASE: ${POSTGRES_DATABASE}
      POSTGRES_USERNAME: ${POSTGRES_USERNAME}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Overridden to the in-container mount path below — your .env's
      # Windows path (C:\Users\...) doesn't exist inside the container.
      CSV_FILE_PATH: /data/Bookings.csv
      TABLE_NAME: ${TABLE_NAME}
      CHUNK_SIZE: ${CHUNK_SIZE}
    volumes:
      # Left side: set CSV_HOST_PATH in your .env to wherever Bookings.csv
      # actually lives on your machine, e.g.
      #   CSV_HOST_PATH=./data/Bookings.csv
      # or an absolute path using forward slashes, e.g.
      #   CSV_HOST_PATH=C:/Users/91852/OneDrive/Desktop/Github Repo/Booking_data/datasets/data/Bookings.csv
      # Using an env var (and forward slashes) avoids Compose misparsing a
      # raw "C:\...\..." value, since backslashes and the drive-letter colon
      # collide with the host:container:mode volume syntax.
      - ${CSV_HOST_PATH}:/data/Bookings.csv:ro
      # Mirrors the container's logs back out to the host, so pipeline_*.log
      # files land in docker/logs on the host, same as C:\UBER\logs does
      # running natively.
      - ./logs:/app/logs

volumes:
  pgdata: